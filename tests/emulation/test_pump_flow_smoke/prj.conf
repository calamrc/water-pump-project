CONFIG_ZTEST=y
CONFIG_ZBUS=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# GPIO is required by the custom drivers
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# Pull in the app's drivers (they will bind to gpio-emul via overlay)
CONFIG_PUMP_CONTROLLER=y
CONFIG_YF_S201C=y
CONFIG_FEEDBACK_RELAY=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# PR4: pump DT present in overlay for full pump_service + status/flow_event asserts
# (ui/display intentionally omitted due to DT in option B smoke test).
