CONFIG_ZTEST=y
CONFIG_ZBUS=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# GPIO is required by the custom drivers
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# Pull in the app's drivers (they will bind to gpio-emul via overlay)
CONFIG_PUMP_CONTROLLER=y
CONFIG_YF_S201C=y
CONFIG_FEEDBACK_RELAY=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
