# Thread and stack configuration for improved reliability
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

# Memory management
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Memory protection - enable stack guards for debugging
CONFIG_MPU_STACK_GUARD=y
CONFIG_THREAD_STACK_INFO=y

# Enable polling API for event-driven processing
CONFIG_POLL=y

# Zbus for inter-thread communication
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16

# Thread configuration for multi-threaded architecture
CONFIG_SENSOR_MONITOR_STACK_SIZE=2048
CONFIG_PUMP_CONTROLLER_STACK_SIZE=3072
CONFIG_SAFETY_MONITOR_STACK_SIZE=1536
CONFIG_SUPERVISOR_STACK_SIZE=2048

# Message queue configuration
CONFIG_APP_SENSOR_MSGQ_SIZE=4

# Thread priorities (lower number = higher priority)
CONFIG_SENSOR_MONITOR_PRIORITY=3
CONFIG_PUMP_CONTROLLER_PRIORITY=2
CONFIG_SAFETY_MONITOR_PRIORITY=1
CONFIG_SUPERVISOR_PRIORITY=7

# Safety monitor configuration
CONFIG_SAFETY_MONITOR_CHECK_INTERVAL_MS=500
CONFIG_SAFETY_MONITOR_MAX_RUNTIME_MINUTES=30
CONFIG_SAFETY_MONITOR_WARNING_THRESHOLD_MINUTES=25

# Display configuration
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_SSD1306_DEFAULT_CONTRAST=128

# Character Framebuffer for text display
CONFIG_CHARACTER_FRAMEBUFFER=y

# Input subsystem for rotary encoder and buttons
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_QDEC=y
CONFIG_INPUT_GPIO_KEYS=y

# UI Thread configuration - increased stack for CFB display operations
CONFIG_UI_MANAGER_STACK_SIZE=9216
CONFIG_UI_MANAGER_PRIORITY=4

# Enable assertions for catching errors
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# Stack protection
CONFIG_STACK_SENTINEL=y

# Disable MPU stack guard (not supported on ESP32)
# CONFIG_MPU_STACK_GUARD is not set

# Logging
# CONFIG_LOG=y
# CONFIG_LOG_DEFAULT_LEVEL=3

# Feedback relay driver
CONFIG_FEEDBACK_RELAY=y
