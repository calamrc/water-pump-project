# Thread and stack configuration for improved reliability
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-1

# Memory management
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Memory protection - enable stack guards for debugging
CONFIG_MPU_STACK_GUARD=y
CONFIG_THREAD_STACK_INFO=y

# Enable polling API for event-driven processing
CONFIG_POLL=y

# Display configuration (still used by new UIService)
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_SSD1306_DEFAULT_CONTRAST=128

# Character Framebuffer for text display (used by new UI path)
CONFIG_CHARACTER_FRAMEBUFFER=y

# Input subsystem for rotary encoder and buttons (used by new InputService)
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_QDEC=y
CONFIG_INPUT_GPIO_KEYS=y

# Enable assertions for catching errors
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# Stack protection
CONFIG_STACK_SENTINEL=y

# Disable MPU stack guard (not supported on ESP32)
# CONFIG_MPU_STACK_GUARD is not set

# Logging
# CONFIG_LOG=y
# CONFIG_LOG_DEFAULT_LEVEL=3

# Feedback relay driver
CONFIG_FEEDBACK_RELAY=y

# zbus publish/subscribe bus (many-to-many communication)
CONFIG_ZBUS=y
CONFIG_ZBUS_PRIORITY_BOOST=y

# Enable runtime observer attachment (needed for services to dynamically
# subscribe to channels at startup instead of only static ZBUS_OBSERVERS lists)
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# State Machine Framework (hierarchical state machines)
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INITIAL_TRANSITION=y

# Task Watchdog (replaces custom thread health monitoring)
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y

# Dedicated cooperative UI work queue (more control than system workqueue)
CONFIG_UI_WORKQ_STACK_SIZE=4096
CONFIG_UI_WORKQ_PRIORITY=5
